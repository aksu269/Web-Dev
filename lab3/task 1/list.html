<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./script.js"></script>
    <title>ToDo List</title>
</head>
<body>
    <header class="header">
        <span class="header-logo">ToDo List</span>
    </header>

    <main class="container">
        <h1>ToDo List</h1>

        <form id="tasksForm" class="todo-form">
            <label for="newTask" class="visually-hidden">New task</label>
            <input name="newTask" id="newTask" placeholder="New Task" autocomplete="off">
            <button type="submit" class="btn-add">Add</button>
        </form>

        <ul id="tasksList" class="tasks-list"></ul>
    </main>
</body>
</html>
