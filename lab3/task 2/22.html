<!DOCTYPE html>
<html>
    <body>
        <script>
            function multiplyNumeric(obj) {
                for (key in obj) {
                    if (typeof obj[key] == "number") {
                        obj[key] *= 2;
                    }
                }
            }
            let menu = {
            width: 200,
            height: 300,
            title: "My menu"
            };

            multiplyNumeric(menu);
            for (key in menu) {
                alert(key + menu[key]);
            }
        </script>
    </body>
</html>
